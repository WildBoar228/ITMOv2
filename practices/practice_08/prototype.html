<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>Quiz Club — Learn something new</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18221d;--muted:#78827c;--paper:#f7f8f5;--white:#fff;--line:#e9ece7;--green:#315b46;--lime:#d8f36a;--soft:#eff4e9;--shadow:0 20px 60px #2236270a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:0 32px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:20px;letter-spacing:-.7px}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:18px}.nav{display:flex;align-items:center;gap:30px}.nav a{color:#737d76;text-decoration:none;font-size:13px;font-weight:600}.nav a.active{color:var(--ink)}.hero{padding:50px 0 34px;display:flex;align-items:flex-end;justify-content:space-between}.eyebrow{font-size:11px;color:var(--green);text-transform:uppercase;font-weight:800;letter-spacing:1.5px;margin:0 0 10px}.hero h1{font:800 clamp(34px,5vw,48px)/1.08 Manrope,sans-serif;letter-spacing:-2px;margin:0}.hero p.sub{margin:12px 0 0;color:var(--muted);font-size:15px}.primary{border:0;border-radius:12px;background:var(--green);color:white;padding:13px 19px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:9px;transition:.2s}.primary:hover{background:#254936;transform:translateY(-1px)}.primary .plus{font-size:19px;font-weight:400;line-height:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.sectionhead h2{font:800 20px Manrope;letter-spacing:-.5px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:60px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 22px 55px #22362713}.cover{height:142px;border-radius:12px;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;overflow:hidden;position:relative}.cover:before,.cover:after{content:'';position:absolute;border-radius:50%;background:#ffffff50}.cover:before{width:140px;height:140px;right:-18px;top:-45px}.cover:after{width:80px;height:80px;right:75px;top:54px;background:#ffffff35}.cover .emoji{position:relative;z-index:1;font-size:44px;filter:drop-shadow(0 8px 8px #0002)}.pill{position:relative;z-index:1;background:#ffffffc9;border-radius:99px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.2px}.card h3{font:800 18px Manrope;letter-spacing:-.5px;margin:16px 0 5px}.card p{font-size:12px;color:var(--muted);margin:0}.cardfoot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid #f0f1ee}.meta{color:#89928c;font-size:11px;display:flex;align-items:center;gap:13px}.playbtn{border:0;background:var(--green);color:white;border-radius:9px;padding:9px 14px;font-weight:700;font-size:11px}.playbtn:hover{background:#254936}.empty-note{text-align:center;color:var(--muted);font-size:12px;grid-column:1/-1;padding:28px}
/* modal/game views */.overlay{position:fixed;inset:0;background:#14201975;backdrop-filter:blur(6px);z-index:5;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.dialog{background:#fff;border-radius:22px;width:min(600px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 100px #0c171159}.dialoghead{padding:23px 25px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialoghead h2{font:800 20px Manrope;margin:0;letter-spacing:-.6px}.close{border:0;background:#f3f5f1;border-radius:9px;width:34px;height:34px;font-size:20px;color:#67746b}.dialogbody{padding:22px 25px 25px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label,.fieldtitle{font-size:11px;font-weight:700;color:#526058}.field input,.field textarea{width:100%;border:1px solid #e3e9e1;border-radius:10px;padding:11px 12px;color:var(--ink);background:#fcfdfa;outline:none;font-size:13px}.field input:focus,.field textarea:focus{border-color:#7aa188;box-shadow:0 0 0 3px #5b98621a}.field textarea{resize:vertical;min-height:64px}.field small{font-size:10px;color:var(--muted)}.questionbox{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.qtitle{font-size:12px;font-weight:800;margin-bottom:12px}.answergrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answerinput{position:relative}.answerinput input{padding-left:34px}.answerinput span{position:absolute;left:12px;top:11px;font-size:11px;font-weight:800;color:#9aa29c}.correct-pick{font-size:11px!important;color:#68756c!important;margin:11px 0 0;display:flex;align-items:center;gap:8px}.correct-pick select{border:1px solid #e3e9e1;border-radius:8px;padding:7px;background:white;color:var(--ink)}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 15px;font-weight:700;font-size:12px;color:#5f6b63}.game-dialog{width:min(670px,100%);padding:28px}.game-top{display:flex;align-items:center;justify-content:space-between}.game-label{font-size:11px;color:var(--muted);font-weight:700}.timer{display:flex;align-items:center;gap:8px;background:#f2f5ed;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:800}.timer.warn{background:#fff0e8;color:#c76640}.timer svg{width:16px}.progress{height:5px;background:#edf0eb;border-radius:10px;margin:19px 0 30px;overflow:hidden}.progress div{height:100%;background:#8ab772;border-radius:10px;transition:width .4s}.game-dialog h2{font:800 26px/1.3 Manrope;letter-spacing:-.7px;margin:0 0 22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:11px;align-items:center;text-align:left;font-size:13px;font-weight:600;color:var(--ink);transition:.15s}.option:hover:not(:disabled){border-color:#86a790;background:#f7faf6}.option .letter{width:27px;height:27px;border-radius:8px;background:#f1f4ef;color:#718077;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.option.correct{border-color:#72a980;background:#eff8ee}.option.correct .letter{background:#418752;color:white}.option.wrong{border-color:#e1a28d;background:#fff5f1}.option:disabled{cursor:default}.feedback{min-height:46px;margin-top:17px;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5;display:none}.feedback.show{display:block}.feedback.good{background:#eff8ee;color:#35633e}.feedback.bad{background:#fff5f1;color:#99513b}.feedback strong{display:block;margin-bottom:3px}.gamebottom{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.scorehint{font-size:11px;color:var(--muted)}.result{text-align:center;padding:16px 10px 7px}.result-mark{width:76px;height:76px;margin:auto auto 16px;background:var(--lime);border-radius:24px;display:grid;place-items:center;font-size:35px}.result h2{font:800 27px Manrope;letter-spacing:-1px;margin:0 0 7px}.result p{font-size:13px;color:var(--muted);margin:0}.resultscore{font:800 54px Manrope;letter-spacing:-3px;color:var(--green);margin:17px 0 2px}.resultstats{display:flex;justify-content:center;gap:34px;margin:17px 0 24px}.resultstats strong{display:block;font:800 18px Manrope}.resultstats span{font-size:10px;color:var(--muted)}.resultactions{display:flex;justify-content:center;gap:9px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);opacity:0;background:#203a2a;color:#fff;border-radius:11px;padding:12px 18px;font-size:12px;z-index:9;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;gap:20px}.nav{gap:16px}}@media(max-width:560px){.shell{padding:0 18px}.topbar{height:64px}.hero{padding:35px 0 24px;flex-direction:column;align-items:stretch}.hero .primary{align-self:flex-start}.grid{grid-template-columns:1fr;gap:12px;padding-bottom:36px}.cover{height:130px}.formrow{grid-template-columns:1fr;gap:0}.answergrid,.answers{grid-template-columns:1fr}.game-dialog{padding:21px}.game-dialog h2{font-size:21px}.resultstats{gap:22px}.dialogbody{padding:18px}.dialoghead{padding:18px}.gamebottom{gap:10px}.scorehint{max-width:145px;line-height:1.4}}
</style>
</head>
<body><div class="shell"><header class="topbar"><a href="#" class="brand"><span class="brandmark">q</span>quiz club</a><nav class="nav" aria-label="Main navigation"><a class="active" href="#games">Games</a></nav></header><main><section class="hero"><div><p class="eyebrow">Your next little challenge</p><h1>Make curiosity<br>your superpower.</h1><p class="sub">Pick a quiz, trust your gut, and see what you know.</p></div><button class="primary" id="newGame"><span class="plus">+</span> New game</button></section><section id="games"><div class="sectionhead"><h2>Find your next quiz</h2><span id="gameCount">6 games</span></div><div class="grid" id="gameGrid"></div></section></main><footer style="border-top:1px solid var(--line);padding:19px 0 26px;color:#929b94;font-size:11px;display:flex;justify-content:space-between"><span>Little quizzes. Big brain energy.</span><span>Made for the curious.</span></footer></div>
<div class="overlay" id="createOverlay" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="dialog"><div class="dialoghead"><div><p class="eyebrow" style="margin-bottom:4px">Make it yours</p><h2 id="createTitle">Create a new quiz</h2></div><button class="close" data-close="createOverlay" aria-label="Close">×</button></div><form class="dialogbody" id="createForm"><div class="formrow"><div class="field"><label for="quizName">Game name</label><input id="quizName" required maxlength="48" placeholder="e.g. Curious about coffee"></div><div class="field"><label for="quizCategory">Category</label><input id="quizCategory" maxlength="24" placeholder="e.g. Food & drink"></div></div><div id="questionBuilder"></div><button type="button" class="secondary" id="addQuestion">+ Add another question</button><div class="formactions"><button type="button" class="secondary" data-close="createOverlay">Cancel</button><button class="primary" type="submit">Save game <span>→</span></button></div></form></div></div>
<div class="overlay" id="gameOverlay" role="dialog" aria-modal="true" aria-labelledby="questionTitle"><div class="dialog game-dialog" id="gamePanel"></div></div><div class="toast" id="toast" role="status"></div>
<script>
const seed=[{name:'The art of coffee',category:'Food & drink',emoji:'☕',color:'#dce8d5',desc:'From bean to your favorite brew.',questions:[{q:'Which country produces the most coffee in the world?',a:['Colombia','Brazil','Ethiopia','Vietnam'],c:1,e:'Brazil has been the world’s largest coffee producer for over 150 years.'},{q:'What is the name for a coffee plant’s fruit?',a:['Coffee berry','Coffee cherry','Coffee plum','Coffee pod'],c:1,e:'Coffee beans are the seeds found inside the coffee cherry.'},{q:'Which espresso drink has the most milk?',a:['Macchiato','Flat white','Cappuccino','Latte'],c:3,e:'A latte combines espresso with steamed milk and a light layer of foam.'}]},{name:'Space, but make it fun',category:'Science',emoji:'🪐',color:'#d9e2f2',desc:'A tiny trip through the cosmos.',questions:[{q:'Which planet has the most moons?',a:['Jupiter','Saturn','Neptune','Uranus'],c:1,e:'Saturn currently leads the count, with more than 140 confirmed moons.'},{q:'How long does sunlight take to reach Earth?',a:['About 8 minutes','About 8 seconds','About 80 minutes','About 1 hour'],c:0,e:'Sunlight takes about 8 minutes and 20 seconds to reach Earth.'}]},{name:'Around the world',category:'Geography',emoji:'🌍',color:'#f1e4cc',desc:'Passport not required for this one.',questions:[{q:'What is the capital of New Zealand?',a:['Auckland','Wellington','Christchurch','Dunedin'],c:1,e:'Wellington became New Zealand’s capital in 1865.'},{q:'Which country has the most natural lakes?',a:['Finland','Russia','Canada','Sweden'],c:2,e:'Canada has more lakes than the rest of the world combined.'}]},{name:'A little art history',category:'Culture',emoji:'🎨',color:'#f2dce1',desc:'Recognize the names behind the masterpieces.',questions:[{q:'Who painted The Starry Night?',a:['Claude Monet','Vincent van Gogh','Pablo Picasso','Paul Cézanne'],c:1,e:'Van Gogh painted it in 1889 while staying at an asylum in Saint-Rémy.'},{q:'Where is the Mona Lisa displayed?',a:['The Met','The Uffizi','The Louvre','The Prado'],c:2,e:'Leonardo da Vinci’s portrait is on display at the Louvre in Paris.'}]},{name:'The animal kingdom',category:'Nature',emoji:'🦊',color:'#e8e5cf',desc:'For anyone who loves a good animal fact.',questions:[{q:'What is the only mammal capable of true flight?',a:['Flying squirrel','Sugar glider','Bat','Colugo'],c:2,e:'Bats are the only mammals that achieve powered, sustained flight.'},{q:'How many hearts does an octopus have?',a:['One','Two','Three','Four'],c:2,e:'Two hearts pump blood to the gills; the third pumps it to the body.'}]},{name:'Movies & popcorn',category:'Entertainment',emoji:'🎬',color:'#e0def0',desc:'A reel good time for film fans.',questions:[{q:'What is the name of the kingdom in Frozen?',a:['Arendelle','Corona','DunBroch','Genovia'],c:0,e:'Arendelle is the fictional Scandinavian kingdom in Disney’s Frozen.'},{q:'Which film won the first Best Animated Feature Oscar?',a:['Toy Story','Shrek','Spirited Away','Monsters, Inc.'],c:1,e:'Shrek won the category at the 74th Academy Awards in 2002.'}]}];const STORAGE_KEY='quiz-club-games';let games;try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));games=Array.isArray(saved)?saved:seed.slice();if(!Array.isArray(saved))localStorage.setItem(STORAGE_KEY,JSON.stringify(games))}catch{games=seed.slice()}let play={};let timerId;function saveGames(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(games));return true}catch{return false}}
const icons=['A','B','C','D'];function renderGrid(){const grid=document.getElementById('gameGrid');document.getElementById('gameCount').textContent=games.length+' games';grid.innerHTML=games.map((g,i)=>`<article class="card"><div class="cover" style="background:${g.color||'#e7eee6'}"><span class="emoji">${g.emoji||'🧠'}</span><span class="pill">${esc(g.category||'General')}</span></div><h3>${esc(g.name)}</h3><p>${esc(g.desc||'A quiz made by you.')}</p><div class="cardfoot"><div class="meta"><span>◷ ${g.questions.length*15} sec</span><span>▤ ${g.questions.length} questions</span></div><button class="playbtn" onclick="startGame(${i})">Play quiz →</button></div></article>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function open(id){document.getElementById(id).classList.add('show')}function close(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o){close(o.id);clearInterval(timerId)}}));
function makeQuestion(i){return `<div class="questionbox"><div class="qtitle">Question ${i+1}</div><div class="field"><label>Question</label><input class="q-text" required maxlength="160" placeholder="What would you like to ask?"></div><div class="fieldtitle" style="margin-bottom:8px">Four answer options</div><div class="answergrid">${icons.map((l,j)=>`<div class="field answerinput" style="margin-bottom:8px"><span>${l}</span><input class="q-answer" required maxlength="90" placeholder="Option ${l}" aria-label="Option ${l}"></div>`).join('')}</div><label class="correct-pick">Correct answer <select class="q-correct">${icons.map((l,j)=>`<option value="${j}">${l}</option>`).join('')}</select></label><div class="field" style="margin:12px 0 0"><label>Explanation <span style="font-weight:400;color:#89928c">· optional</span></label><input class="q-explain" maxlength="200" placeholder="A fun fact or helpful context"></div></div>`}
let qCount=0;function addQuestion(){document.getElementById('questionBuilder').insertAdjacentHTML('beforeend',makeQuestion(qCount++))}document.getElementById('newGame').onclick=()=>{qCount=0;document.getElementById('createForm').reset();document.getElementById('questionBuilder').innerHTML='';addQuestion();open('createOverlay')};document.getElementById('addQuestion').onclick=addQuestion;
document.getElementById('createForm').onsubmit=e=>{e.preventDefault();const qs=[...document.querySelectorAll('.questionbox')].map(box=>({q:box.querySelector('.q-text').value.trim(),a:[...box.querySelectorAll('.q-answer')].map(x=>x.value.trim()),c:Number(box.querySelector('.q-correct').value),e:box.querySelector('.q-explain').value.trim()}));games.unshift({name:document.getElementById('quizName').value.trim(),category:document.getElementById('quizCategory').value.trim()||'Made by you',emoji:'✨',color:'#e6efd2',desc:'A fresh quiz, made by you.',questions:qs});const saved=saveGames();renderGrid();close('createOverlay');document.getElementById('createForm').reset();toast(saved?'Your new quiz is ready to play.':'Your quiz was added for this session, but could not be saved on this device.');document.getElementById('games').scrollIntoView({behavior:'smooth'})};
function startGame(idx){clearInterval(timerId);play={game:games[idx],idx:0,score:0,correct:0,choice:null,seconds:15};open('gameOverlay');renderQuestion()}
function renderQuestion(){clearInterval(timerId);let q=play.game.questions[play.idx];play.seconds=15;play.choice=null;let n=play.idx+1,total=play.game.questions.length;document.getElementById('gamePanel').innerHTML=`<div class="game-top"><span class="game-label">${esc(play.game.name)} · ${n} of ${total}</span><span class="timer" id="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="seconds">15</span>s</span></div><div class="progress"><div style="width:${(n-1)/total*100}%"></div></div><h2 id="questionTitle">${esc(q.q)}</h2><div class="answers">${q.a.map((a,i)=>`<button class="option" data-choice="${i}"><span class="letter">${icons[i]}</span>${esc(a)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="gamebottom"><span class="scorehint">+10 points, plus time left, for a correct answer</span><button class="primary" id="nextBtn" disabled>Next question →</button></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));document.getElementById('nextBtn').onclick=nextQuestion;timerId=setInterval(()=>{play.seconds--;const s=document.getElementById('seconds'),t=document.getElementById('timer');if(s)s.textContent=play.seconds;if(t&&play.seconds<=5)t.classList.add('warn');if(play.seconds<=0){clearInterval(timerId);if(play.choice===null)timeoutQuestion()}},1000)}
function choose(i){if(play.choice!==null)return;clearInterval(timerId);play.choice=i;let q=play.game.questions[play.idx],good=i===q.c;if(good){play.score+=10+Math.ceil(play.seconds);play.correct++}document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');if(j===i&&j!==q.c)b.classList.add('wrong')});let f=document.getElementById('feedback');f.className='feedback show '+(good?'good':'bad');f.innerHTML=`<strong>${good?'That’s right! Nice one.':'Not quite — the correct answer is '+esc(q.a[q.c])+'.'}</strong>${q.e?esc(q.e):''}`;document.getElementById('nextBtn').disabled=false;document.getElementById('nextBtn').textContent=play.idx===play.game.questions.length-1?'To the result →':'Next question →'}
function timeoutQuestion(){let q=play.game.questions[play.idx];document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct')});let f=document.getElementById('feedback');f.className='feedback show bad';f.innerHTML=`<strong>Time’s up!</strong>${q.e?'The answer was '+esc(q.a[q.c])+'. '+esc(q.e):'The answer was '+esc(q.a[q.c])+'.'}`;document.getElementById('nextBtn').disabled=false;document.getElementById('nextBtn').textContent=play.idx===play.game.questions.length-1?'To the result →':'Next question →'}
function nextQuestion(){if(play.idx<play.game.questions.length-1){play.idx++;renderQuestion()}else showResult()}function showResult(){clearInterval(timerId);document.getElementById('gamePanel').innerHTML=`<div class="result"><div class="result-mark">${play.correct===play.game.questions.length?'✦':'✓'}</div><p class="eyebrow">Quiz complete</p><h2>${play.correct===play.game.questions.length?'Perfect score!':play.correct===0?'Good try!':'Nice work!'}</h2><p>You finished <strong>${esc(play.game.name)}</strong></p><div class="resultscore">${play.score}<span style="font-size:18px;letter-spacing:0">pts</span></div><div class="resultstats"><div><strong>${play.correct}/${play.game.questions.length}</strong><span>Correct answers</span></div><div><strong>${Math.round(play.correct/play.game.questions.length*100)}%</strong><span>Accuracy</span></div></div><div class="resultactions"><button class="secondary" id="backGames">← All games</button><button class="primary" id="replay">Play again ↻</button></div></div>`;document.getElementById('backGames').onclick=()=>close('gameOverlay');document.getElementById('replay').onclick=()=>startGame(games.indexOf(play.game))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay.show').forEach(o=>close(o.id));clearInterval(timerId)}});renderGrid();
</script></body></html>
